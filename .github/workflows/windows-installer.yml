name: Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [windows-installer]
  # Build the setup.exe on PRs that change what goes into it.
  pull_request:
    paths:
      - src-tauri/tauri.conf.json
      - src-tauri/windows/**
      - src-tauri/tauri.engine.conf.json
      - scripts/windows/package-portable.ps1
      - native/**
      - .github/workflows/windows-installer.yml

permissions:
  contents: read

jobs:
  build:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the engine's pre-build stamps GIT_COUNT/GIT_COMMIT from history
      - uses: microsoft/setup-msbuild@v3
      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: corepack enable
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: src-tauri
      - run: corepack pnpm install --frozen-lockfile
      - run: corepack pnpm test:unit
      - name: Build disk-usage engine
        shell: pwsh
        working-directory: native/diskusage
        run: |
          msbuild windirstat.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 "/p:ExternalCompilerOptions=/DPRODUCTION=1"
          if ($LASTEXITCODE -ne 0) { throw 'msbuild failed' }
      - name: Test disk-usage engine (compare, change tracking, history)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File native/diskusage/tests/Test-ForkChanges.ps1 -ExePath native/diskusage/build/altWinDirStat_x64.exe
          if ($LASTEXITCODE -ne 0) { throw "Engine tests failed (exit $LASTEXITCODE)" }
      - name: Disk Usage flow against the real engine (snapshot, change, snapshot, compare)
        shell: pwsh
        run: |
          $env:DISKUSAGE_ENGINE = (Resolve-Path native/diskusage/build/altWinDirStat_x64.exe).Path
          cargo test -p diskusage-core --manifest-path src-tauri/Cargo.toml -- --ignored
          if ($LASTEXITCODE -ne 0) { throw "diskusage-core engine test failed (exit $LASTEXITCODE)" }
      - name: Stage engine as Tauri sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Copy-Item native/diskusage/build/altWinDirStat_x64.exe src-tauri/binaries/deepserver-diskusage-x86_64-pc-windows-msvc.exe
      - run: corepack pnpm tauri build --config src-tauri/tauri.engine.conf.json
      - name: Package portable zip
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows/package-portable.ps1 -SkipBuild
      - name: Collect outputs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*-setup.exe out/
          Copy-Item src-tauri/target/release/bundle/portable/*.zip out/
          Get-ChildItem out -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content out/SHA256SUMS.txt
      - name: Silent install / uninstall smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem out -Filter '*-setup.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/S' -PassThru
          if (-not $p.WaitForExit(300000)) { throw 'installer timed out' }
          $exe = Join-Path $env:ProgramFiles 'DeepServer\DeepServer.exe'
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $keys = 'HKLM:\Software\Classes\*\shell\DeepServer', 'HKLM:\Software\Classes\Directory\shell\DeepServerSelectLeft'
          foreach ($k in $keys) { if (-not (Test-Path -LiteralPath "$k\command")) { throw "missing $k" } }
          $cmd = (Get-ItemProperty -LiteralPath "$($keys[0])\command").'(default)'
          $engine = Join-Path $env:ProgramFiles 'DeepServer\deepserver-diskusage.exe'
          if (-not (Test-Path $engine)) { throw "missing $engine" }
          $diskKey = 'HKLM:\Software\Classes\Drive\shell\DeepServer Disk Usage\command'
          if ((Get-ItemProperty -LiteralPath $diskKey).'(default)' -notlike '*deepserver-diskusage.exe*') { throw "missing $diskKey" }
          $keys += 'HKLM:\Software\Classes\Directory\shell\DeepServer Disk Usage'
          if ($cmd -notlike '*DeepServer.exe*--shell-compare*') { throw "unexpected menu command: $cmd" }
          $p = Start-Process (Join-Path $env:ProgramFiles 'DeepServer\uninstall.exe') -ArgumentList '/S' -PassThru
          $p.WaitForExit(300000) | Out-Null
          # The NSIS uninstaller re-launches itself from %TEMP%, so poll for the cleanup.
          $deadline = (Get-Date).AddMinutes(3)
          while ((Test-Path $exe) -or (Test-Path $engine) -or @($keys | Where-Object { Test-Path -LiteralPath $_ }).Count) {
            if ((Get-Date) -gt $deadline) { throw 'uninstall left files or menu keys behind' }
            Start-Sleep -Seconds 2
          }
          'install/uninstall OK'
      - uses: actions/upload-artifact@v6
        with:
          name: DeepServer-windows
          path: out/
          if-no-files-found: error

  # The engine's own upstream suites (need PowerShell 7.6+) and its large-scan stress test. Runs next to
  # the installer build. The Ui, Settings, Mtp and Reparse suites are left out: Ui waits for windows
  # titled "WinDirStat" (this build is "DeepServer Disk Usage"), Settings rebuilds the solution, Mtp
  # needs a phone and Reparse formats scratch drives. Upstream skips the last three in CI too.
  engine-upstream-tests:
    name: Engine upstream tests (x64)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # the engine's pre-build stamps GIT_COUNT/GIT_COMMIT from history
      - uses: microsoft/setup-msbuild@v3
      - name: Build disk-usage engine
        shell: pwsh
        working-directory: native/diskusage
        run: |
          msbuild windirstat.sln /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 "/p:ExternalCompilerOptions=/DPRODUCTION=1"
          if ($LASTEXITCODE -ne 0) { throw 'msbuild failed' }
          New-Item -ItemType Directory -Force ([IO.Path]::Combine($env:RUNNER_TEMP, 'engine')) | Out-Null
          Copy-Item build/altWinDirStat_x64.exe ([IO.Path]::Combine($env:RUNNER_TEMP, 'engine', 'altWinDirStat.exe'))
      - name: Upstream test suites (Filtering, Cli, EdgeCases, Permissions, Enumeration, Unc)
        timeout-minutes: 40
        shell: pwsh
        working-directory: native/diskusage
        run: |
          # Test-WinDirStat.ps1 requires PowerShell 7.6+; fetch the latest stable pwsh when the runner's is older.
          $pwsh = (Get-Command pwsh).Source
          if ($PSVersionTable.PSVersion -lt [version]'7.6') {
            $dir = [IO.Path]::Combine($env:RUNNER_TEMP, 'pwsh-x64')
            gh release download --repo PowerShell/PowerShell --pattern 'PowerShell-*-win-x64.zip' --dir $env:RUNNER_TEMP --clobber
            Expand-Archive (Get-ChildItem $env:RUNNER_TEMP -Filter 'PowerShell-*-win-x64.zip' | Select-Object -First 1).FullName $dir -Force
            $pwsh = [IO.Path]::Combine($dir, 'pwsh.exe')
          }
          & $pwsh -NoProfile -Command '"PowerShell $($PSVersionTable.PSVersion)"'
          & $pwsh -NoProfile -ExecutionPolicy Bypass -File tests/Test-WinDirStat.ps1 -ExePath ([IO.Path]::Combine($env:RUNNER_TEMP, 'engine', 'altWinDirStat.exe')) -Platform x64 -Only Filtering,Cli,EdgeCases,Permissions,Enumeration,Unc
          if ($LASTEXITCODE -ne 0) { throw "Upstream test suites failed (exit $LASTEXITCODE)" }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Large-scan stress test
        timeout-minutes: 45
        shell: pwsh
        working-directory: native/diskusage
        run: |
          & .github/scripts/Stress-LargeScan.ps1 -ExePath ([IO.Path]::Combine($env:RUNNER_TEMP, 'engine', 'altWinDirStat.exe'))
