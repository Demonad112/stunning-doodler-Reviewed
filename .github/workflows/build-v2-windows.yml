name: Build V2 Windows

# Reusable: builds the DeepServer 2.0 installers (standard, and offline with the WebView2 runtime inside), the
# portable zip and SHA256SUMS.txt, smoke-tests both installers and uploads everything as the DeepServer2-windows
# artifact. Called by v2.yml (pull requests, main) and release-v2.yml (v2.* tags). Unsigned for now.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build (defaults to the triggering ref)
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: App version read from V2.0/src-tauri/tauri.conf.json
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Installers and portable zip
    runs-on: windows-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        working-directory: V2.0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false
          package_json_file: V2.0/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: V2.0/pnpm-lock.yaml

      - run: corepack enable

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: V2.0/src-tauri

      - id: version
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - run: corepack pnpm install --frozen-lockfile

      - name: Standard installer
        run: corepack pnpm tauri build

      - name: Collect the standard installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $nsis = 'src-tauri/target/release/bundle/nsis'
          Copy-Item "$nsis/DeepServer_${env:VERSION}_x64-setup.exe" 'out/'
          Remove-Item -Recurse -Force $nsis

      - name: Offline installer (WebView2 included)
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          corepack pnpm tauri bundle --bundles nsis --config src-tauri/tauri.offline.conf.json
          if ($LASTEXITCODE -ne 0) { throw "tauri bundle failed ($LASTEXITCODE)" }
          Copy-Item "src-tauri/target/release/bundle/nsis/DeepServer_${env:VERSION}_x64-setup.exe" "out/DeepServer_${env:VERSION}_x64-offline-setup.exe"

      - name: Portable zip
        shell: pwsh
        run: |
          $zip = ./scripts/package-portable.ps1 | Select-Object -Last 1
          Copy-Item $zip out/

      - name: Check the offline installer carries WebView2
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $std = (Get-Item "out/DeepServer_${env:VERSION}_x64-setup.exe").Length
          $off = (Get-Item "out/DeepServer_${env:VERSION}_x64-offline-setup.exe").Length
          $mb = [math]::Round(($off - $std) / 1MB)
          Write-Output "standard $([math]::Round($std / 1MB)) MB, offline $([math]::Round($off / 1MB)) MB (+$mb MB)"
          if (($off - $std) -lt 100MB) { throw "offline installer is only $mb MB larger than the standard one; WebView2 is missing" }

      - name: SHA256SUMS.txt
        shell: pwsh
        run: |
          Push-Location out
          Get-ChildItem -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt
          Pop-Location

      - name: Smoke-test the standard installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Test-Installer.ps1 -Setup "out/DeepServer_${env:VERSION}_x64-setup.exe"

      - name: Smoke-test the offline installer
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/Test-Installer.ps1 -Setup "out/DeepServer_${env:VERSION}_x64-offline-setup.exe"

      - uses: actions/upload-artifact@v6
        with:
          name: DeepServer2-windows
          path: V2.0/out/*
          if-no-files-found: error
