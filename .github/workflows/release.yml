name: Release

# Windows only. Runs on a pushed v* tag, or manually for an existing tag (E20): a manual run without a tag is
# rejected instead of falling back to the branch name. Assets: the standard and offline/server installers, the
# portable zip and SHA256SUMS.txt. -alpha/-beta/-rc tags publish a pre-release; final tags create a draft that
# the owner reviews and publishes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish (for example v1.0.0-rc1)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            echo "::error::Releases are built from tags only."
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not a release tag like v1.0.0 or v1.0.0-rc1."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::error::Tag $tag does not exist. Push it first: git tag $tag && git push origin $tag"
            exit 1
          fi
          git checkout -q "refs/tags/$tag"
          want="${tag#v}"
          want="${want%%-*}"
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          if [ "$tauri" != "$want" ] || [ "$pkg" != "$want" ]; then
            echo "::error::Tag $tag needs version $want, but tauri.conf.json has $tauri and package.json has $pkg."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $want)"

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build-windows.yml
    with:
      ref: refs/tags/${{ needs.verify.outputs.tag }}
      sign: true
    secrets: inherit

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: DeepServer-windows
          path: out
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -la out
          (cd out && sha256sum -c SHA256SUMS.txt)
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
          else
            flags=(--draft)
            if printf '%s' "$TAG" | grep -qE -- '-(alpha|beta|rc)'; then flags=(--prerelease); fi
            cat > notes.md <<EOF
          DeepServer ${TAG} for Windows 10/11 and Windows Server 2016+ (Desktop Experience).

          | File | Use it for |
          | --- | --- |
          | \`DeepServer_${VERSION}_x64-setup.exe\` | Workstations and servers with internet access (downloads WebView2 if it's missing) |
          | \`DeepServer_${VERSION}_x64-offline-setup.exe\` | Offline or locked-down servers (WebView2 runtime included) |
          | \`DeepServer_${VERSION}_windows_x64_portable.zip\` | No install: unzip and run \`DeepServer.exe\` (no Explorer menu) |
          | \`SHA256SUMS.txt\` | Checksums for the files above |

          Silent install: \`DeepServer_${VERSION}_x64-offline-setup.exe /S\`. See [docs/install.md](https://github.com/${GH_REPO}/blob/${TAG}/docs/install.md).
          EOF
            gh release create "$TAG" "${flags[@]}" --verify-tag --title "DeepServer $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --clobber
