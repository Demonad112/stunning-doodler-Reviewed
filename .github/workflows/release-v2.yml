name: Release V2

# DeepServer 2.0 releases (v2.* tags). Same rules as release.yml, which now handles v1.* only: runs on a pushed
# tag, or manually for a tag (a manual run without a tag is rejected). A manual run with create_tag creates a
# missing tag on `target` (default: the default branch) after the version check and builds it in the same run.
# Assets: the standard and offline installers, the portable zip and SHA256SUMS.txt. -alpha/-beta/-rc tags
# publish a pre-release; final tags create a draft that the owner reviews and publishes. Unsigned for now.
# The tag v2.0.0-rc1 needs version 2.0.0 in V2.0/package.json and V2.0/src-tauri/tauri.conf.json.
on:
  push:
    tags:
      - 'v2.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and publish (for example v2.0.0-rc1)
        required: true
        type: string
      create_tag:
        description: Create the tag if it doesn't exist yet
        required: false
        type: boolean
        default: false
      target:
        description: 'Branch or commit for a new tag (default: the default branch)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-v2-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          CREATE_TAG: ${{ inputs.create_tag }}
          TARGET: ${{ inputs.target || github.event.repository.default_branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            echo "::error::Releases are built from tags only."
            exit 1
          fi
          if ! printf '%s' "$tag" | grep -qE '^v2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::'$tag' is not a DeepServer 2 tag like v2.0.0 or v2.0.0-rc1."
            exit 1
          fi
          new_tag=false
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            git checkout -q "refs/tags/$tag"
          elif [ "$EVENT" = "workflow_dispatch" ] && [ "$CREATE_TAG" = "true" ]; then
            sha=$(git rev-parse -q --verify "origin/$TARGET^{commit}" || git rev-parse -q --verify "$TARGET^{commit}") || {
              echo "::error::Target '$TARGET' is not a branch or commit."
              exit 1
            }
            git checkout -q "$sha"
            new_tag=true
          else
            echo "::error::Tag $tag does not exist. Push it first (git tag $tag && git push origin $tag), or run this workflow by hand with create_tag."
            exit 1
          fi
          want="${tag#v}"
          want="${want%%-*}"
          tauri=$(jq -r .version V2.0/src-tauri/tauri.conf.json)
          pkg=$(jq -r .version V2.0/package.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' V2.0/src-tauri/Cargo.toml | head -n 1)
          if [ "$tauri" != "$want" ] || [ "$pkg" != "$want" ] || [ "$cargo" != "$want" ]; then
            echo "::error::Tag $tag needs version $want, but tauri.conf.json has $tauri, package.json has $pkg and Cargo.toml has $cargo."
            exit 1
          fi
          if [ "$new_tag" = "true" ]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$sha" > /dev/null
            echo "Created tag $tag on $TARGET ($sha)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (version $want)"

  build:
    name: Build
    needs: verify
    uses: ./.github/workflows/build-v2-windows.yml
    with:
      ref: refs/tags/${{ needs.verify.outputs.tag }}

  publish:
    name: Publish GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DeepServer2-windows
          path: out
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          ls -la out
          (cd out && sha256sum -c SHA256SUMS.txt)
          prerelease=false
          if printf '%s' "$TAG" | grep -qE -- '-(alpha|beta|rc)'; then prerelease=true; fi
          cat > notes.md <<EOF
          DeepServer ${TAG} for Windows 10/11 and Windows Server 2016+ (Desktop Experience).

          Installing it replaces DeepServer 1.x in place (same install folder; the old Explorer menu entries are removed).
          Records and reports from 2.0 betas stay where they are.

          | File | Use it for |
          | --- | --- |
          | \`DeepServer_${VERSION}_x64-setup.exe\` | PCs with internet access (downloads WebView2 if it's missing) |
          | \`DeepServer_${VERSION}_x64-offline-setup.exe\` | Offline or locked-down PCs and servers (WebView2 runtime included) |
          | \`DeepServer_${VERSION}_windows_x64_portable.zip\` | No install: unzip and run \`DeepServer.exe\`; records and reports are saved in the \`Data\` folder next to it |
          | \`SHA256SUMS.txt\` | Checksums for the files above |

          Silent install: \`DeepServer_${VERSION}_x64-offline-setup.exe /S\`. See [V2.0/docs/install.md](https://github.com/${GH_REPO}/blob/${TAG}/V2.0/docs/install.md).
          EOF
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists; replacing its assets."
            edit=()
            # Never touch the draft state of a final release: a re-run must not unpublish it.
            if [ "$prerelease" = "true" ]; then edit+=(--prerelease); fi
            if [ -z "$(gh release view "$TAG" --json body --jq .body)" ]; then edit+=(--notes-file notes.md); fi
            if [ ${#edit[@]} -gt 0 ]; then gh release edit "$TAG" "${edit[@]}"; fi
          else
            flags=(--draft)
            if [ "$prerelease" = "true" ]; then flags=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" --verify-tag --title "DeepServer $TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --clobber
