version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - '*'

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-dependencies:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /V2.0
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      v2-frontend-dependencies:
        patterns:
          - '*'
    ignore:
      # vue-tsc 3.x needs the JS compiler; TypeScript 7 (native) breaks `vue-tsc`.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: cargo
    directory: /V2.0/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      v2-rust-dependencies:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
